
syntax = "proto3";
option go_package = "RTVMandatoryActivity3/grpc/proto";

message ClientMessage {
    string name = 1;
    int32 lamport = 2;
    bool leave = 3;
    string message = 4;
}

message ServerMessage {
    string originalSender = 1;
    int32 lamport = 2;
    string message = 3;
}

service ChitChat {
    rpc Chat(stream ClientMessage) returns (stream ServerMessage);
}